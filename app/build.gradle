plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ojalacrade.mazepets'
    compileSdk 36

    defaultConfig {
        applicationId "com.ojalacrade.mazepets"
        minSdk 24
        targetSdk 36
        versionCode 8       // Puraana 7 tha, ab 8 kar diya hai naye update ke liye
        versionName "1.5"   // Version name 1.4 se badha kar 1.5 kar diya hai
    }

    signingConfigs {
        release {
            storeFile file("maze-pets-upload-key-v4.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
}
