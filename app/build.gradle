plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ojalacrade.mazepets'
    compileSdk 36

    defaultConfig {
        applicationId "com.ojalacrade.mazepets"
        minSdk 21
        targetSdk 36
        versionCode 5     // Naya version code (Pichla 4 tha)
        versionName "1.2" // Naya version name (Pichla "1.1" tha)
    }

    signingConfigs {
        release {
            storeFile file("maze-pets-upload-key-v4.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// dependencies block hamesha android { } block ke BAHAR hota hai
dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
}
