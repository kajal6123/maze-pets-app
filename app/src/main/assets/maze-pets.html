<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#04130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Maze Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020e0a;overflow:hidden;overscroll-behavior:none}
body{font-family:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:relative;height:100dvh;max-width:440px;margin:0 auto;overflow:hidden;background:#04130f;box-shadow:0 0 60px rgba(0,255,160,.08)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.art{display:block;width:1em;height:1em;object-fit:contain;margin:0 auto}

.sign{position:relative;display:inline-block;padding:10px 34px 12px;border-radius:18px;
  background:linear-gradient(180deg,#b57337 0%,#8a531f 55%,#6b3d17 100%);
  border:3px solid #d8994f;box-shadow:inset 0 2px 0 rgba(255,220,160,.45),0 6px 0 #3e2209,0 12px 24px rgba(0,0,0,.5);
  font-weight:700;text-align:center;color:#fff;
  -webkit-text-stroke:2px #4a2508;paint-order:stroke fill;text-shadow:0 3px 0 #4a2508}
.sign small{display:block;font-size:14px;font-weight:500;-webkit-text-stroke:0;text-shadow:0 1px 0 #4a2508;color:#ffe9c4;margin-top:-2px}

.btn{padding:13px 22px;border-radius:999px;font-size:19px;font-weight:600;letter-spacing:.2px;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.green{background:linear-gradient(180deg,#3df07d,#16b04d);border:2px solid #8dffb3;box-shadow:0 5px 0 #0c6b2e,0 0 22px rgba(60,240,125,.45);text-shadow:0 2px 0 rgba(0,70,25,.6)}
.btn.dark{background:linear-gradient(180deg,#0e4a3d,#08302a);border:2px solid #2fd9a0;box-shadow:0 5px 0 #041c17;color:#e6fff6}
.btn.big{font-size:24px;padding:16px 34px;width:100%}

#home{align-items:center;justify-content:center;gap:22px;padding:24px;
  background:radial-gradient(ellipse at 50% 30%,#0f6a4c 0%,#073826 45%,#020f0b 100%)}
#sndBtn{font-size:17px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(3,30,22,.75);border:2px solid #2fd9a0;font-weight:600;font-size:17px}
.pill.lives{border-color:#ff6b8b;cursor:pointer}
.pill.lives small{font-weight:600;font-size:11px;opacity:.8;margin-left:1px}
.topPills{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:2}
#homePet{font-size:130px;line-height:1;width:1em;height:1em;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.homeTitle{font-size:44px;padding:12px 40px 14px}
.tag{color:#b9f6de;font-size:17px;text-align:center;margin:0;opacity:.9}
.homeBtns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:300px}
.infinity{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:15px;color:#8fe9c6;opacity:.75}

#game{--wall:#2bffc6;background:linear-gradient(180deg,#0a3d33,#031712)}
#deco{position:absolute;inset:0;pointer-events:none}
#deco span{position:absolute;font-size:34px;opacity:.5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.hud{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
.hud .ttl b{display:block;font-size:21px;font-weight:600;line-height:1.1}
.hud .ttl span{font-size:14px;color:var(--wall);font-weight:500}
.hudR{display:flex;align-items:center;gap:10px}
.timer{min-width:76px;text-align:center;padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.35);border:2px solid var(--wall);font-size:19px;font-weight:600;box-shadow:0 0 14px color-mix(in srgb,var(--wall) 40%,transparent);font-variant-numeric:tabular-nums}
.round{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid var(--wall);display:grid;place-items:center;color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--wall) 40%,transparent)}
.round svg{width:18px;height:18px}
.starBar{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;margin:0 0 2px;pointer-events:none}
.starBar i{font-style:normal;font-size:21px;color:rgba(255,255,255,.25);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:color .25s,transform .25s}
.starBar i.on{color:#ffe14a;text-shadow:0 0 10px rgba(255,225,90,.85),0 2px 0 rgba(120,80,0,.5);transform:scale(1.18)}
.starBar i.lost{animation:starpop .4s}
@keyframes starpop{0%{transform:scale(1.5) rotate(-14deg)}100%{transform:scale(1) rotate(0)}}
#stage{position:relative;flex:1;margin:4px 12px 6px;z-index:1;overflow:hidden;border-radius:18px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:relative;z-index:2;display:flex;gap:12px;padding:6px 16px calc(16px + env(safe-area-inset-bottom));justify-content:center}
.bar button{flex:1;max-width:120px;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 6px;border-radius:999px;
  background:linear-gradient(180deg,rgba(10,70,52,.9),rgba(4,36,28,.92));border:2px solid #34e29b;color:#dcfff0;box-shadow:0 0 14px rgba(52,226,155,.3)}
.bar button:active{transform:scale(.95)}
.bar button.used{opacity:.4;filter:grayscale(1)}
.bar svg{width:20px;height:20px;flex:none;color:#ffe873}
.bar .lb{display:flex;flex-direction:column;line-height:1.05;text-align:left;font-size:14px;font-weight:600}
.bar .lb i{font-style:normal;font-size:12px;color:#ffe873;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(1,10,8,.72);backdrop-filter:blur(2px);padding:20px}
.overlay.show{display:flex}
.winWrap{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.winWrap:before{content:"";position:absolute;top:-30px;left:50%;width:360px;height:360px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,225,90,.5),rgba(255,225,90,0) 65%);pointer-events:none}
#winPet{position:relative;font-size:120px;line-height:1;width:1em;height:1em;margin-bottom:-26px;z-index:2;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));animation:bob 2s ease-in-out infinite}
.winWrap .sign{z-index:3;font-size:44px;padding:8px 40px 12px}
.winCard{position:relative;z-index:1;width:100%;margin-top:-16px;padding:36px 20px 20px;border-radius:26px;text-align:center;
  background:linear-gradient(180deg,#5a3616,#33200e);border:4px solid #2f9e4f;box-shadow:0 0 0 3px #1d6b34,0 18px 40px rgba(0,0,0,.6)}
.winName{font-size:32px;font-weight:700;color:#ffd84a;text-shadow:0 2px 0 #7a4a08,0 0 16px rgba(255,216,74,.4)}
.meal{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:600;margin:6px 0 12px}
.meal span{font-size:34px}
.reward{display:flex;align-items:center;gap:10px}
.vine{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#3fbf5a)}
.vine.r{transform:scaleX(-1)}
.paw{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 35% 30%,#ffe58a,#f0a71a);border:3px solid #ffd45a;box-shadow:0 0 20px rgba(255,200,60,.6)}
.stat{margin:10px 0 16px;font-size:16px;color:#ffe9c4}
.btnRow{display:flex;gap:12px}
.btnRow .btn{flex:1;padding:12px 8px}
#pauseOverlay .sign{font-size:38px}
#pauseOverlay .col{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:280px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:25}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast,#toast2{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:30;padding:9px 18px;border-radius:999px;background:rgba(0,0,0,.8);border:1.5px solid #34e29b;font-size:15px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.show,#toast2.show{opacity:1;transform:translateX(-50%)}

#pets{align-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;background:radial-gradient(ellipse at 50% 0%,#0d5a3f,#06281d 55%,#020f0b)}
.back{position:absolute;top:calc(20px + env(safe-area-inset-top));left:14px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid #34e29b;display:grid;place-items:center;font-size:22px;z-index:3}
.petsHead{margin-top:6px;font-size:30px;padding:8px 30px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;margin:26px 0 auto}
.tile{aspect-ratio:1/1.12;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,#1c7a4c,#0b3d2b);border:3px solid #38c46f;box-shadow:inset 0 0 14px rgba(120,255,170,.25),0 5px 0 #052117;font-size:13px;font-weight:600}
.tile .em{font-size:44px;line-height:1;width:1em;height:1em}
.tile.lock{filter:grayscale(1);opacity:.45}
.tile.lock .em{filter:brightness(0) opacity(.6)}
.tile.pop{animation:tpop .4s}
@keyframes tpop{40%{transform:scale(1.12) rotate(-4deg)}}
.banner{margin-top:14px;padding:12px 18px;border-radius:18px;text-align:center;font-size:17px;font-weight:500;color:#ffe9c4;
  background:linear-gradient(180deg,#7a4a1e,#4f2f12);border:3px solid #b9803f;box-shadow:0 5px 0 #2f1a08}
@media (prefers-reduced-motion:reduce){#homePet,#winPet,.winWrap{animation:none}.confetti i{animation-duration:6s!important}}

/* level map */
#map{background:radial-gradient(ellipse at 50% 15%,#0d5a43 0%,#062e22 48%,#020f0b 100%)}
.mapHead{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(180deg,rgba(2,15,11,.96) 55%,rgba(2,15,11,0))}
.mapHead .back{position:static;flex:none}
.mapMid{display:flex;flex-direction:column;align-items:center;gap:6px}
.mapTitle{font-size:22px;padding:5px 22px 8px}
.chip{font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:rgba(3,30,22,.8);border:1.5px solid #2fd9a0;color:#c9ffe9}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;margin-top:-6px}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%}
#mapSvg{position:absolute;left:0;top:0;pointer-events:none}
#mapSvg .flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.mapFoot{position:relative;z-index:3;padding:8px 22px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(2,15,11,.95) 60%,rgba(2,15,11,0))}
.nd{position:absolute;width:0;height:0;cursor:pointer}
.nd .med{position:absolute;left:-31px;top:-31px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#1f8f6c,#083a2c 75%);border:3px solid var(--rc);
  box-shadow:0 0 16px color-mix(in srgb,var(--rc) 55%,transparent),inset 0 -8px 12px rgba(0,0,0,.4),0 5px 0 rgba(0,0,0,.45)}
.nd .pf{width:48px;height:48px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.nd .num{position:absolute;left:-30px;width:60px;top:22px;margin:0 auto;text-align:center}
.nd .num{left:50%;transform:translateX(-50%);width:auto;min-width:28px;padding:1px 9px 2px;border-radius:999px;background:var(--rc);color:#04231a;font-size:15px;font-weight:700;border:2px solid rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.nd .st{position:absolute;left:-30px;width:60px;top:48px;text-align:center;font-size:12px;letter-spacing:1px;color:#ffd84a;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.nd .shp{position:absolute;left:-70px;width:140px;top:66px;text-align:center;font-size:13px;font-weight:600;color:#c9ffe9;text-shadow:0 1px 3px #000}
.nd .fg{position:absolute;left:14px;top:-40px;font-size:17px;filter:drop-shadow(0 0 4px #000)}
.nd .cr{position:absolute;left:-14px;top:-50px;font-size:20px;filter:drop-shadow(0 2px 2px #000)}
.nd .lk{position:absolute;left:14px;top:-4px;font-size:14px}
.nd.lock .med{filter:saturate(.35) brightness(.72);border-color:#2b6b58;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.nd.lock .pf{filter:brightness(0) opacity(.5)}
.nd.lock .num{background:#0a2a22;color:#79bfa6;border-color:#2b6b58}
.nd.cur .med{transform:scale(1.28);animation:pulse 1.5s ease-in-out infinite}
.nd.cur:before{content:"";position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 45%,transparent),transparent 68%);pointer-events:none}
.nd.cur .num{top:30px}
.nd.cur .go{position:absolute;left:-30px;width:60px;top:-70px;text-align:center;padding:2px 0 3px;border-radius:12px;background:#ffe14a;color:#5a3a00;font-size:14px;font-weight:700;border:2px solid #fff6b8;box-shadow:0 3px 0 #a87400;animation:hop 1s ease-in-out infinite}
.nd.cur .go:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#ffe14a;border-bottom:0}
@keyframes pulse{50%{transform:scale(1.36);box-shadow:0 0 28px var(--rc),inset 0 -8px 12px rgba(0,0,0,.4),0 5px 0 rgba(0,0,0,.45)}}
@keyframes hop{50%{transform:translateY(-6px)}}
#winAdapt{margin:-6px 0 12px;font-size:14px;color:#ffe9a8;min-height:0}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen active">
    <button class="pill" id="homeSnd" style="position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px" aria-label="Sound">🔊</button>
    <div class="topPills"><button class="pill lives" id="homeLivesPill">❤️ <span id="homeLives">5</span><small>/5</small></button><div class="pill coins">🪙 <span id="homeCoins">20</span></div></div>
    <div class="sign homeTitle">Maze Pets</div>
    <div id="homePet"></div>
    <p class="tag">Trace the glowing maze and get<br>every pet to its meal.</p>
    <div class="homeBtns">
      <button class="btn green big" id="playBtn">Play Level 1</button>
      <button class="btn dark" id="mapBtn">Level Map</button>
      <button class="btn dark" id="petsBtn">Your Pets</button>
    </div>
    <div class="infinity">Endless levels · the game adapts to how you play</div>
  </section>

  <section id="game" class="screen">
    <div id="deco"></div>
    <header class="hud">
      <div class="ttl"><b id="lvlName">Level 1</b><span id="themeName">Circle</span></div>
      <div class="hudR">
        <div class="timer" id="timer">0:00</div>
        <button class="round" id="sndBtn" aria-label="Sound">🔊</button>
        <button class="round" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.5"/></svg></button>
      </div>
    </header>
    <div class="starBar" id="starBar"><i>★</i><i>★</i><i>★</i></div>
    <main id="stage"><canvas id="cv"></canvas></main>
    <footer class="bar">
      <button id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21h6M10 18h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="lb">Hint<i>5 🪙 ·1</i></span></button>
      <button id="restartBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg><span class="lb">Restart</span></button>
    </footer>

    <div class="overlay" id="winOverlay">
      <div class="confetti" id="confetti"></div>
      <div class="winWrap">
        <div id="winPet"></div>
        <div class="sign">You Win!</div>
        <div class="winCard">
          <div class="winName" id="winName">Bruno</div>
          <div class="meal"><span id="winGoal">🦴</span> Get Meal</div>
          <div class="reward"><div class="vine"></div><div class="paw">🐾</div><div class="vine r"></div></div>
          <div class="stat" id="winStat">0:28 · +15 🪙</div>
          <div id="winAdapt"></div>
          <div class="btnRow">
            <button class="btn green" id="nextBtn">Next Level</button>
            <button class="btn dark" id="homeBtn">Map</button>
          </div>
        </div>
      </div>
    </div>

    <div class="overlay" id="pauseOverlay">
      <div class="col">
        <div class="sign">Paused</div>
        <button class="btn green big" id="resumeBtn">Resume</button>
        <button class="btn dark big" id="pRestartBtn">Restart</button>
        <button class="btn dark big" id="pHomeBtn">Level Map</button>
      </div>
    </div>
    <div id="toast"></div>
  </section>

  <section id="map" class="screen">
    <header class="mapHead">
      <button class="back" id="mapBack" aria-label="Back">‹</button>
      <div class="mapMid"><div class="sign mapTitle">Level Map</div></div>
      <button class="pill lives" id="mapLivesPill" style="font-size:14px;padding:5px 11px">❤️ <span id="mapLives">5</span><small>/5</small></button>
      <div class="pill coins" style="font-size:16px;padding:5px 11px">🪙 <span id="mapCoins">20</span></div>
    </header>
    <div id="mapScroll"><div id="mapInner"></div></div>
    <div class="mapFoot"><button class="btn green big" id="mapPlay">Play Level 1</button></div>
    <div id="toast2"></div>
  </section>

  <section id="pets" class="screen">
    <button class="back" id="backBtn" aria-label="Back">‹</button>
    <div class="sign petsHead">🐾 Your Pets 🐾<small id="petsSub">Collect all the animals!</small></div>
    <div class="grid" id="petGrid"></div>
    <div class="banner">🐾 More animals, more mazes, more fun! 🐾</div>
  </section>
</div>

<script>

function seedRand(n){let t=n>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
function genAnimal(level){
  const R=seedRand(level*2654435761+97),pick=arr=>arr[Math.floor(R()*arr.length)];
  const hue=Math.floor(R()*360),body=hsl(hue,60+R()*22,54+R()*10),belly=hsl(hue,38+R()*16,88),dark=hsl(hue,55,26);
  const earStyle=R()<.34?0:R()<.68?1:2,pat=R()<.4?'spots':R()<.7?'stripes':'plain';
  const patColor=hsl((hue+50+R()*70)%360,55,42),acc=R()<.28?'bow':R()<.52?'cap':R()<.74?'scarf':'none',accColor=hsl(Math.floor(R()*360),68,56);
  let ears='';
  if(earStyle===0)ears=`<circle cx="62" cy="66" r="20" fill="${body}" stroke="${dark}" stroke-width="4"/><circle cx="138" cy="66" r="20" fill="${body}" stroke="${dark}" stroke-width="4"/><circle cx="62" cy="70" r="9" fill="${belly}"/><circle cx="138" cy="70" r="9" fill="${belly}"/>`;
  else if(earStyle===1)ears=`<path d="M58 78 L44 30 L82 62 Z" fill="${body}" stroke="${dark}" stroke-width="4" stroke-linejoin="round"/><path d="M142 78 L156 30 L118 62 Z" fill="${body}" stroke="${dark}" stroke-width="4" stroke-linejoin="round"/>`;
  else ears=`<path d="M55 74 Q28 90 40 128 Q56 118 66 88 Z" fill="${body}" stroke="${dark}" stroke-width="4"/><path d="M145 74 Q172 90 160 128 Q144 118 134 88 Z" fill="${body}" stroke="${dark}" stroke-width="4"/>`;
  let pattern='';
  if(pat==='spots')for(let i=0;i<5;i++){const px=70+R()*60,py=95+R()*55,pr=5+R()*7;pattern+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${pr.toFixed(1)}" ry="${(pr*.8).toFixed(1)}" fill="${patColor}" opacity=".8"/>`}
  else if(pat==='stripes')for(let i=0;i<4;i++){const sy=88+i*17;pattern+=`<path d="M${(46+R()*8).toFixed(0)} ${sy} Q100 ${sy-10} ${(154-R()*8).toFixed(0)} ${sy}" stroke="${patColor}" stroke-width="6" fill="none" opacity=".75" stroke-linecap="round"/>`}
  let accessory='';
  if(acc==='bow')accessory=`<path d="M100 78 L82 65 L82 91 Z" fill="${accColor}"/><path d="M100 78 L118 65 L118 91 Z" fill="${accColor}"/><circle cx="100" cy="78" r="6" fill="${accColor}" stroke="#fff3" stroke-width="1.5"/>`;
  else if(acc==='cap')accessory=`<path d="M68 72 Q100 40 132 72 Z" fill="${accColor}"/><rect x="66" y="68" width="68" height="10" rx="5" fill="${accColor}"/>`;
  else if(acc==='scarf')accessory=`<path d="M62 148 Q100 168 138 148 L134 172 Q100 184 66 172 Z" fill="${accColor}"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
${ears}
<ellipse cx="100" cy="128" rx="66" ry="56" fill="${body}" stroke="${dark}" stroke-width="5"/>
${pattern}
<ellipse cx="100" cy="146" rx="36" ry="28" fill="${belly}"/>
<circle cx="79" cy="112" r="16" fill="#fff"/><circle cx="121" cy="112" r="16" fill="#fff"/>
<circle cx="82" cy="115" r="7.5" fill="#241a12"/><circle cx="124" cy="115" r="7.5" fill="#241a12"/>
<circle cx="85" cy="111" r="2.4" fill="#fff"/><circle cx="127" cy="111" r="2.4" fill="#fff"/>
<ellipse cx="65" cy="132" rx="8" ry="5" fill="#ff9db0" opacity=".55"/><ellipse cx="135" cy="132" rx="8" ry="5" fill="#ff9db0" opacity=".55"/>
<ellipse cx="100" cy="136" rx="11" ry="7" fill="${dark}" opacity=".9"/><circle cx="100" cy="133" r="2.6" fill="#1a120c"/>
${accessory}
</svg>`;
  const art='data:image/svg+xml,'+encodeURIComponent(svg);
  return{name:pick(GEN_ADJ)+' '+pick(GEN_NOUN),pet:pick(GEN_PET),goal:pick(GEN_GOAL),art,gen:true};
}
const genCache={};
function getAnimal(level){
  if(level<=ANIMALS.length)return ANIMALS[level-1];
  if(!genCache[level]){const a=genAnimal(level);const im=new Image();im.src=a.art;a.imgEl=im;genCache[level]=a}
  return genCache[level];
}

const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))),x=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');return'#'+x(0)+x(8)+x(4)};
const mkG=(name,h)=>({name,s:'g',c:hsl(h,100,66),body:hsl(h,70,38),hl:hsl(h,95,76),dark:hsl(h,85,8),floor:'rgba(0,28,14,.6)',bg:[hsl(h,72,40),hsl(h,82,16)],trail:'#f4fff8'});
const mkP=(name,h)=>({name,s:'p',c:hsl(h,100,82),body:hsl(h,70,22),hl:hsl(h,95,72),dark:hsl(h,80,9),floor:'rgba(80,0,30,.22)',bg:[hsl(h,78,58),hsl(h,74,35)],trail:'#fff3f8'});
const THEMES=[mkG('Emerald',150),mkP('Rose',340),mkG('Mint',168),mkP('Berry',322),mkG('Forest',120),mkP('Coral',355),mkG('Jade',178),mkP('Magenta',300),mkG('Lime',92),mkP('Blush',346),mkG('Teal',188),mkP('Ruby',350)];

const SHAPES={
 rect:{aw:1,ah:1,f:()=>true},
 cross:{aw:1,ah:1,f:(u,v)=>Math.abs(u-.5)<.19||Math.abs(v-.5)<.19},
 figure8:{aw:1,ah:1.85,f:(u,v)=>Math.hypot(u-.5,v-.5)<.5||Math.hypot(u-.5,v-1.35)<.5},
 triangle:{aw:1,ah:1,f:(u,v,e)=>Math.abs(u-.5)<=v*.5+e*.6},
 diamond:{aw:1,ah:1,f:(u,v)=>Math.abs(u-.5)+Math.abs(v-.5)<.5},
 ring:{aw:1,ah:1,f:(u,v)=>{const d=Math.hypot(u-.5,v-.5);return d<.5&&d>.2}},
 heart:{aw:1,ah:1,f:(u,v)=>{const x=(u-.5)*2.5,y=(.52-v)*2.5,a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0}},
 hourglass:{aw:1,ah:1,f:(u,v)=>Math.abs(u-.5)<=.1+.4*Math.abs(2*v-1)},

const store={mem:{},get(k){try{return localStorage.getItem(k)}catch(e){return this.mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.mem[k]=v}}};
let S={level:1,coins:12,lives:5,maxLives:5,nextLifeAt:0};
try{const raw=store.get('mazepets-v2');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
S.stars=S.stars||{};
S.maxLives=S.maxLives||5;S.lives=(S.lives==null)?S.maxLives:S.lives;S.nextLifeAt=S.nextLifeAt||0;
const save=()=>store.set('mazepets-v2',JSON.stringify(S));

/* ---------- lives: free slow regen, or refill with coins (stand-in for a future real-money purchase) ---------- */
const LIFE_MS=15*60*1000,LIFE_COST=20;
function regenLives(){
  if(S.lives>=S.maxLives){S.nextLifeAt=0;return}
  if(!S.nextLifeAt)S.nextLifeAt=Date.now()+LIFE_MS;
  let changed=false;
  while(S.lives<S.maxLives&&Date.now()>=S.nextLifeAt){S.lives++;changed=true;S.nextLifeAt=S.lives>=S.maxLives?0:S.nextLifeAt+LIFE_MS}
  if(changed)save();
}
function livesLabel(){
  regenLives();
  if(S.lives>=S.maxLives)return'Full';
  const ms=Math.max(0,S.nextLifeAt-Date.now()),m=Math.floor(ms/60000),sc=Math.floor(ms%60000/1000);
  return m+':'+String(sc).padStart(2,'0');
}
function renderLives(){
  regenLives();
  [['#homeLives','#homeLivesPill'],['#mapLives','#mapLivesPill']].forEach(([n,p])=>{
    const el=$(n);if(el)el.textContent=S.lives;
    const pl=$(p);if(pl)pl.title=S.lives<S.maxLives?'Next free life in '+livesLabel()+' · or '+LIFE_COST+' 🪙':'Lives full';
  });
}
function tryRefillLife(){
  regenLives();
  if(S.lives>=S.maxLives){toast('Lives are already full ❤️');return}
  if(S.coins>=LIFE_COST){
    S.coins-=LIFE_COST;S.lives=Math.min(S.maxLives,S.lives+1);
    if(S.lives>=S.maxLives)S.nextLifeAt=0;
    save();Snd.hint();toast('+1 life ❤️');
  }else{

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const key=(a,b)=>a<b?a*100000+b:b*100000+a;
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* growing-tree maze: p=1 long winding corridors, low p = many branches/dead ends */
function carve(n,nb,p,seed){
  const seen=new Uint8Array(n),pass=new Set(),list=[seed];seen[seed]=1;
  while(list.length){
    const idx=Math.random()<p?list.length-1:(Math.random()*list.length|0),u=list[idx];
    const c=nb[u].filter(v=>!seen[v]);
    if(!c.length){list[idx]=list[list.length-1];list.pop();continue}
    const v=c[Math.random()*c.length|0];seen[v]=1;pass.add(key(u,v));list.push(v);
  }
  return pass;
}
function bfsPath(adj,from,to,maxDepth=1e9){
  if(from===to)return[];
  const prev=new Int32Array(adj.length).fill(-2);prev[from]=-1;
  let fr=[from],d=0;
  while(fr.length&&d<maxDepth){
    const nx=[];d++;
    for(const u of fr)for(const v of adj[u])if(prev[v]===-2){
      prev[v]=u;
      if(v===to){const p=[];let c=v;while(c!==from){p.push(c);c=prev[c]}return p.reverse()}
      nx.push(v);
    }
    fr=nx;
  }
  return null;
}
function farthest(adj,s){
  const d=new Int32Array(adj.length).fill(-1);d[s]=0;const q=[s];
  for(let i=0;i<q.length;i++){const u=q[i];for(const v of adj[u])if(d[v]<0){d[v]=d[u]+1;q.push(v)}}
  const last=q[q.length-1];return{node:last,dist:d[last]};
}
/* try several mazes, keep the one with the longest solution (= hardest) */
function bestMaze(nb,N,start,p,tries,goal){
  let best=null;
  for(let t=0;t<tries;t++){
    const pass=carve(N,nb,p,start);
    const adj=nb.map((l,u)=>l.filter(v=>pass.has(key(u,v))));
    let g=goal,sol;
    if(g===undefined){const f=farthest(adj,start);g=f.node;sol=f.dist}
    else{const pa=bfsPath(adj,start,g);sol=pa?pa.length:0}
    if(!best||sol>best.sol)best={pass,adj,goal:g,sol};
  }
  return best;
}
function keepLargest(inm,N,nbOf){
  const comp=new Int32Array(N).fill(-1);let best=-1,bs=0,cid=0;
  for(let s=0;s<N;s++){
    if(!inm[s]||comp[s]>=0)continue;
    const q=[s];comp[s]=cid;
    for(let i=0;i<q.length;i++)for(const v of nbOf(q[i]))if(v>=0&&inm[v]&&comp[v]<0){comp[v]=cid;q.push(v)}
    if(q.length>bs){bs=q.length;best=cid}cid++;
  }
  for(let i=0;i<N;i++)inm[i]=(inm[i]&&comp[i]===best)?1:0;
}
const bp=P=>{if(P.beginPath)P.beginPath()};

/* ---------- 1) square grid inside a shape (square, cross, heart, ring ...) ---------- */
function makeMask(shape,cs0,WW,HH,top,pad,p,tries){
  const sh=SHAPES[shape],availW=WW-2*pad,availH=HH-top-pad;
  let bw,bh;
  if(shape==='rect'){bw=availW;bh=availH}
  else{const a=sh.aw/sh.ah;bh=Math.min(availH,availW/a);bw=bh*a}
  const cols=Math.max(5,Math.floor(bw/cs0)),rows=Math.max(5,Math.floor(bh/cs0));
  const cs=Math.min(bw/cols,bh/rows);
  const ox=(WW-cs*cols)/2,oy=top+(availH-cs*rows)/2,N=cols*rows;
  const inm=new Uint8Array(N);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    inm[r*cols+c]=sh.f((c+.5)/cols*sh.aw,(r+.5)/rows*sh.ah,1/cols)?1:0;
  keepLargest(inm,N,u=>{const r=(u/cols)|0,c=u%cols;return[c>0?u-1:-1,c<cols-1?u+1:-1,r>0?u-cols:-1,r<rows-1?u+cols:-1]});
  const IN=(c,r)=>c>=0&&r>=0&&c<cols&&r<rows&&inm[r*cols+c]===1;
  const nb=Array.from({length:N},()=>[]);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(!IN(c,r))continue;const id=r*cols+c;
    if(IN(c+1,r)){nb[id].push(id+1);nb[id+1].push(id)}
    if(IN(c,r+1)){nb[id].push(id+cols);nb[id+cols].push(id)}
  }
  let start=-1,bs=1e9;
  for(let i=0;i<N;i++)if(inm[i]){const s=(i%cols)+((i/cols)|0)*1.05;if(s<bs){bs=s;start=i}}
  const{pass,adj,goal,sol}=bestMaze(nb,N,start,p,tries);
  const sc=start%cols,sr=(start/cols)|0;
  const gap=!IN(sc,sr-1)?'top':(!IN(sc-1,sr)?'left':null);
  return{
    type:'mask',n:N,adj,start,goal,cs,sol,
    center:id=>({x:ox+((id%cols)+.5)*cs,y:oy+(((id/cols)|0)+.5)*cs}),
    fill(P){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(IN(c,r))P.rect(ox+c*cs-.3,oy+r*cs-.3,cs+.6,cs+.6)},
    path(P){
      bp(P);
      const seg=(a,b,c,d)=>{P.moveTo(a,b);P.lineTo(c,d)};
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        if(!IN(c,r))continue;
        const id=r*cols+c,x=ox+c*cs,y=oy+r*cs;
        if(!IN(c+1,r)||!pass.has(key(id,id+1)))seg(x+cs,y,x+cs,y+cs);
        if(!IN(c,r+1)||!pass.has(key(id,id+cols)))seg(x,y+cs,x+cs,y+cs);
        if(!IN(c-1,r)&&!(id===start&&gap==='left'))seg(x,y,x,y+cs);
        if(!IN(c,r-1)&&!(id===start&&gap==='top'))seg(x,y,x+cs,y);
      }
    }
  };
}

/* ---------- 2) circle (concentric rings) - reusable part ---------- */
function polarGrid(cx,cy,Rout,cs0){
  const r0=cs0*1.6,rings=Math.max(3,Math.floor((Rout-r0)/cs0)),w=(Rout-r0)/rings,TAU=Math.PI*2,A0=-Math.PI/2;
  const counts=[0,8];
  for(let r=2;r<=rings;r++){const rho=r0+(r-.5)*w;counts[r]=(TAU*rho/counts[r-1]>1.6*w)?counts[r-1]*2:counts[r-1]}
  const first=[0,1];for(let r=2;r<=rings;r++)first[r]=first[r-1]+counts[r-1];
  const N=first[rings]+counts[rings],ID=(r,s)=>first[r]+s;
  const nb=Array.from({length:N},()=>[]);
  const link=(a,b)=>{nb[a].push(b);nb[b].push(a)};
  for(let r=1;r<=rings;r++){const cnt=counts[r];
    for(let s=0;s<cnt;s++){
      const id=ID(r,s);link(id,ID(r,(s+1)%cnt));
      if(r===1)link(id,0);
      if(r<rings){const nr=counts[r+1];
        if(nr===cnt)link(id,ID(r+1,s));else{link(id,ID(r+1,2*s));link(id,ID(r+1,2*s+1))}}
    }}
  return{N,nb,counts,rings,w,ID,
    center(id){
      if(id===0)return{x:cx,y:cy};
      let r=1;while(r<rings&&id>=first[r+1])r++;
      const s=id-first[r],rho=r0+(r-.5)*w,a=A0+(s+.5)/counts[r]*TAU;
      return{x:cx+rho*Math.cos(a),y:cy+rho*Math.sin(a)};
    },
    fill(P){P.moveTo(cx+Rout,cy);P.arc(cx,cy,Rout,0,TAU)},
    draw(P,pass,off,gaps){
      const K=(a,b)=>pass.has(key(a+off,b+off));
      const arc=(rad,a1,a2)=>{P.moveTo(cx+rad*Math.cos(a1),cy+rad*Math.sin(a1));P.arc(cx,cy,rad,a1,a2)};
      for(let r=1;r<=rings;r++){
        const cnt=counts[r],rin=r0+(r-1)*w,rout=rin+w;
        for(let s=0;s<cnt;s++){
          const id=ID(r,s),a1=A0+s/cnt*TAU,a2=A0+(s+1)/cnt*TAU;
          if(!K(id,ID(r,(s+1)%cnt))){P.moveTo(cx+rin*Math.cos(a2),cy+rin*Math.sin(a2));P.lineTo(cx+rout*Math.cos(a2),cy+rout*Math.sin(a2))}
          if(r===1&&!K(id,0))arc(rin,a1,a2);
          if(r<rings){const nr=counts[r+1];
            if(nr===cnt){if(!K(id,ID(r+1,s)))arc(rout,a1,a2)}
            else for(let k=0;k<2;k++){const ch=2*s+k;
              if(!K(id,ID(r+1,ch)))arc(rout,A0+ch/nr*TAU,A0+(ch+1)/nr*TAU)}}
          else if(!gaps.has(s))arc(rout,a1,a2);
        }
      }
    }
  };
}
function makePolar(cs0,WW,HH,top,pad,p,tries){
  const availW=WW-2*pad,availH=HH-top-pad,Rout=Math.min(availW,availH)/2;
  const g=polarGrid(WW/2,top+availH/2,Rout,cs0);
  const startS=Math.floor(.875*g.counts[g.rings]),start=g.ID(g.rings,startS);
  const b=bestMaze(g.nb,g.N,start,p,tries,0);
  return{type:'polar',n:g.N,adj:b.adj,start,goal:0,cs:g.w,sol:b.sol,center:g.center,
    path(P){bp(P);g.draw(P,b.pass,0,new Set([startS]))},fill(P){g.fill(P)}};
}

/* ---------- 3) two circles joined: start in one centre, goal in the other centre ---------- */
function makeTwin(cs0,WW,HH,top,pad,p,tries){
  const availW=WW-2*pad,availH=HH-top-pad,vert=availH>=availW*.9;
  const R=vert?Math.min(availW/2,availH/4):Math.min(availW/4,availH/2);
  const cx=WW/2,cy=top+availH/2;
  const A=polarGrid(vert?cx:cx-R,vert?cy-R:cy,R,cs0),B=polarGrid(vert?cx:cx+R,vert?cy+R:cy,R,cs0);
  const off=A.N,N=A.N+B.N,nb=Array.from({length:N},()=>[]);
  A.nb.forEach((l,i)=>{nb[i]=l.slice()});B.nb.forEach((l,i)=>{nb[i+off]=l.map(v=>v+off)});
  const cnt=A.counts[A.rings],sa=vert?cnt/2:cnt/4,sb=vert?cnt-1:3*cnt/4-1;
  const ca=A.ID(A.rings,sa),cb=B.ID(B.rings,sb)+off;nb[ca].push(cb);nb[cb].push(ca);
  const b=bestMaze(nb,N,0,p,tries,off);
  return{type:'twin',n:N,adj:b.adj,start:0,goal:off,cs:A.w,sol:b.sol,
    center:id=>id<off?A.center(id):B.center(id-off),
    path(P){bp(P);A.draw(P,b.pass,0,new Set([sa]));B.draw(P,b.pass,off,new Set([sb]))},
    fill(P){A.fill(P);B.fill(P)}};
}

/* ---------- 4) triangle grid (triangle, hexagon, zigzag ...) ---------- */
const DSHAPES={
  tri:{a:1.1547,f:(u,v)=>Math.abs(u-.5)<=v*.5+1e-6},
  itri:{a:1.1547,f:(u,v)=>Math.abs(u-.5)<=(1-v)*.5+1e-6},
  hex:{a:1.1547,f:(u,v)=>Math.abs(u-.5)<=.5-.25*Math.abs(2*v-1)+1e-6},
  rhomb:{a:1,f:(u,v)=>Math.abs(u-.5)+Math.abs(v-.5)<=.5+1e-6},
  trap:{a:1.45,f:(u,v)=>Math.abs(u-.5)<=.27+.23*v+1e-6},
  zig:{a:0,f:()=>true}
};
function makeDelta(shape,cs0,WW,HH,top,pad,p,tries){
  const sh=DSHAPES[shape],availW=WW-2*pad,availH=HH-top-pad,H3=Math.sqrt(3)/2;
  let bw,bh;
  if(!sh.a){bw=availW;bh=availH}else{bh=Math.min(availH,availW/sh.a);bw=bh*sh.a}
  const s0=cs0*1.6;
  let R,C,par=0;
  if(shape==='tri'||shape==='itri'){R=Math.max(6,Math.floor(Math.min(bw/s0,bh/(H3*s0))));C=2*R-1;par=shape==='tri'?(R-1)%2:1}
  else if(shape==='hex'){const k=Math.max(3,Math.floor(Math.min(bw/(2*s0),bh/(2*H3*s0))));R=2*k;C=4*k-1;par=1}
  else{C=Math.max(7,Math.floor(2*bw/s0)-1);R=Math.max(6,Math.floor(bh/(H3*s0)))}
  const s=Math.min(2*bw/(C+1),bh/(H3*R)),h=H3*s,Wd=(C+1)*s/2,Hd=R*h;
  const ox=(WW-Wd)/2,oy=top+(availH-Hd)/2,N=R*C;
  const isUp=(r,c)=>((r+c+par)&1)===0;
  const cen=id=>{const r=(id/C)|0,c=id%C;return{x:ox+(c+1)*s/2,y:oy+(r+(isUp(r,c)?2/3:1/3))*h}};
  const inm=new Uint8Array(N);
  for(let id=0;id<N;id++){const q=cen(id);inm[id]=sh.f((q.x-ox)/Wd,(q.y-oy)/Hd)?1:0}
  const nbOf=u=>{const r=(u/C)|0,c=u%C,up=isUp(r,c);
    return[c>0?u-1:-1,c<C-1?u+1:-1,up?(r<R-1?u+C:-1):(r>0?u-C:-1)]};
  keepLargest(inm,N,nbOf);
  const IN=(r,c)=>r>=0&&c>=0&&r<R&&c<C&&inm[r*C+c]===1;
  const nb=Array.from({length:N},()=>[]);
  for(let u=0;u<N;u++){if(!inm[u])continue;for(const v of nbOf(u))if(v>u&&inm[v]){nb[u].push(v);nb[v].push(u)}}
  let start=-1,bs=1e18;
  for(let u=0;u<N;u++)if(inm[u]){const q=cen(u),d=q.x-ox+(q.y-oy)*1.1;if(d<bs){bs=d;start=u}}
  const b=bestMaze(nb,N,start,p,tries);
  const pass=b.pass;
  return{type:'delta',n:N,adj:b.adj,start,goal:b.goal,cs:.577*s,sol:b.sol,center:cen,
    fill(P){
      for(let r=0;r<R;r++)for(let c=0;c<C;c++){
        if(!IN(r,c))continue;
        const x0=ox+c*s/2,x1=x0+s/2,x2=x0+s,y0=oy+r*h,y1=y0+h;
        if(isUp(r,c)){P.moveTo(x0-.3,y1+.3);P.lineTo(x2+.3,y1+.3);P.lineTo(x1,y0-.4)}
        else{P.moveTo(x0-.3,y0-.3);P.lineTo(x2+.3,y0-.3);P.lineTo(x1,y1+.4)}
        P.closePath();
      }
    },
    path(P){
      bp(P);
      const seg=(a,b2,c2,d)=>{P.moveTo(a,b2);P.lineTo(c2,d)};
      for(let r=0;r<R;r++)for(let c=0;c<C;c++){
        if(!IN(r,c))continue;
        const id=r*C+c,up=isUp(r,c),x0=ox+c*s/2,x1=x0+s/2,x2=x0+s,y0=oy+r*h,y1=y0+h;
        if(!IN(r,c+1)||!pass.has(key(id,id+1)))up?seg(x2,y1,x1,y0):seg(x2,y0,x1,y1);
        if(!IN(r,c-1))up?seg(x0,y1,x1,y0):seg(x0,y0,x1,y1);
        if(up){if(!IN(r+1,c)||!pass.has(key(id,id+C)))seg(x0,y1,x2,y1)}
        else if(!IN(r-1,c))seg(x0,y0,x2,y0);
      }
    }
  };
}

/* ---------- level design: every level a new shape, harder forever ---------- */
const CATALOG=[
  {t:'polar',n:'Circle'},{t:'grid',s:'rect',n:'Square'},{t:'delta',s:'tri',n:'Triangle'},{t:'grid',s:'cross',n:'Cross'},
  {t:'twin',n:'Twin Circles'},{t:'delta',s:'hex',n:'Hexagon'},{t:'grid',s:'ring',n:'Ring'},{t:'delta',s:'zig',n:'Zigzag'},
  {t:'grid',s:'heart',n:'Heart'},{t:'delta',s:'itri',n:'Flip Triangle'},{t:'grid',s:'diamond',n:'Diamond'},{t:'delta',s:'rhomb',n:'Rhombus'},
  {t:'grid',s:'hourglass',n:'Hourglass'},{t:'twin',n:'Twin Circles'},{t:'grid',s:'figure8',n:'Figure 8'},{t:'delta',s:'trap',n:'Trapezoid'},
  {t:'grid',s:'bowtie',n:'Bowtie'},{t:'polar',n:'Circle'}
];
/* difficulty: fixed per level number, always increasing, never eases off */
const isFog=L=>L>=8&&L%4===0;   // every 4th level from 8: dark maze
let fogOn=false;
function levelParams(L){
  return{
    cs:Math.max(7.5,21-1.3*(L-1)),                         // cells shrink fast, then keep shrinking slowly
    p:Math.max(.12,.8-.04*(L-1)),                          // more and more branches / dead ends
    zoom:L<=10?1:(L<=22?1+.115*(L-10):2.38+1.62*(1-Math.exp(-(L-22)/60))),   // bigger scrolling mazes, never stops
    cat:CATALOG[(L-1)%CATALOG.length]
  };
}

let W=0,H=0,WW=0,HH=0,dpr=1,cam={x:0,y:0};
let P={cur:0,queue:[],step:null,x:0,y:0},trail=[];
let elapsed=0,running=false,won=false,hintUntil=0,lastT=0,lastSec=-1,dragging=false,solLen=0;
let starT1=0,starT2=0,starLimit=0,starCount=3;

function show(name){

function fit(){
  const r=stage.getBoundingClientRect();

  dpr=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
function buildMaze(){
  const lp=levelParams(level),c=lp.cat;
  WW=Math.round(W*lp.zoom);HH=Math.round(H*lp.zoom);
  const tries=lp.zoom>3?1:(lp.zoom>1.4?2:6);
  const pp=Math.min(.85,Math.max(.55,lp.p+.3));   // circles need long corridors to stay hard
  maze=c.t==='polar'?makePolar(lp.cs,WW,HH,TOP,PAD,pp,tries)
      :c.t==='twin'?makeTwin(lp.cs,WW,HH,TOP,PAD,pp,tries)

}
function buildWalls(){
  const cdpr=Math.max(1,Math.min(dpr,3200/Math.max(WW,HH)));
  wallCv=document.createElement('canvas');wallCv.width=Math.ceil(WW*cdpr);wallCv.height=Math.ceil(HH*cdpr);
  const w=wallCv.getContext('2d');w.setTransform(cdpr,0,0,cdpr,0,0);w.lineCap='round';w.lineJoin='round';
  const cs=maze.cs,pink=theme.s==='p',lw=Math.max(1.8,Math.min(pink?6:9,cs*(pink?.3:.4)));
  const fl=new Path2D();maze.fill(fl);w.fillStyle=theme.floor;w.fill(fl);
  const pth=new Path2D();maze.path(pth);
  if(!pink){w.save();w.strokeStyle=theme.c;w.globalAlpha=.16;w.lineWidth=lw*2.6;w.stroke(pth);w.globalAlpha=.22;w.lineWidth=lw*1.7;w.stroke(pth);w.restore()}
  w.save();w.translate(lw*.12,lw*.32);w.strokeStyle='rgba(0,0,0,.5)';w.lineWidth=lw*1.12;w.stroke(pth);w.restore();
  w.strokeStyle=theme.dark;w.lineWidth=lw*1.12;w.stroke(pth);
  w.strokeStyle=theme.body;w.lineWidth=lw*.8;w.stroke(pth);
  w.save();w.translate(-lw*.06,-lw*.13);w.strokeStyle=theme.hl;w.globalAlpha=pink?.55:.92;w.lineWidth=Math.max(.8,lw*.26);w.stroke(pth);w.restore();
}
function applyTheme(){

function updateStars(n){
  [...document.querySelectorAll('#starBar i')].forEach((e,i)=>{

/* ---------- movement ---------- */
function startStep(now){
  if(!P.queue.length){P.step=null;return}
  const to=P.queue.shift(),a=maze.center(P.cur),b=maze.center(to);
  P.step={from:P.cur,to,t0:now,dur:Math.max(42,Math.min(100,Math.hypot(b.x-a.x,b.y-a.y)*4.5))};
}
function arrive(node){
  P.cur=node;

/* relative-drag control: drag anywhere, the dot follows the corridors */
const acc={x:0,y:0};
function drive(){
  if(!running||won||!maze)return;
  const K=.5,cap=maze.cs*2.4;
  for(let it=0;it<10;it++){
    const chain=[P.cur];if(P.step)chain.push(P.step.to);for(const q of P.queue)chain.push(q);
    if(chain.length>7)break;
    const base=chain[chain.length-1];
    const prev=chain.length>1?chain[chain.length-2]:(trail.length>1?trail[trail.length-2]:-1);
    const nbrs=maze.adj[base],mag=Math.hypot(acc.x,acc.y);
    if(!nbrs.length||mag<1.5)break;
    const b=maze.center(base);
    const cand=nbrs.map(n=>{const c=maze.center(n),vx=c.x-b.x,vy=c.y-b.y,L=Math.hypot(vx,vy)||1;return{n,L,pr:(acc.x*vx+acc.y*vy)/L}});
    let pick=null;
    if(nbrs.length===2&&nbrs.includes(prev)){
      const f=cand.find(c=>c.n!==prev),bk=cand.find(c=>c.n===prev);
      if(bk.pr>=K*bk.L&&bk.pr>f.pr+.35*f.L)pick=bk;
      else if(mag>=K*f.L*1.2&&f.pr>=bk.pr-.35*f.L)pick=f;
    }else{
      pick=cand.reduce((a,c)=>c.pr>a.pr?c:a);
      if(pick.pr<K*pick.L)pick=null;
    }
    if(!pick)break;
    if(pick.n===prev&&P.queue.length>0)P.queue.pop();else P.queue.push(pick.n);
    const nm=Math.max(0,mag-K*pick.L),s=nm/mag;acc.x*=s;acc.y*=s;
  }
  const m=Math.hypot(acc.x,acc.y),cap2=maze.cs*2.4;

}

  const cs=maze.cs;
  if(fogOn){

  ctx.lineTo(P.x,P.y);ctx.stroke();ctx.restore();

function frame(now){
  requestAnimationFrame(frame);

  if(running&&!won){
    elapsed+=dt;const sec=Math.floor(elapsed/1000);
    if(sec!==lastSec){lastSec=sec;$('#timer').textContent=fmt(Math.max(0,starLimit-elapsed))}
    let sc=elapsed<starT1?3:elapsed<starT2?2:elapsed<starLimit?1:0;
    if(hintsUsed>0)sc=Math.min(sc,2);
    if(sc!==starCount){starCount=sc;updateStars(sc)}
    if(!P.step&&P.queue.length)startStep(now);
    let guard=0;
    while(P.step&&guard++<6){
      const t=Math.min(1,(now-P.step.t0)/P.step.dur);

const Snd={
  ac:null,on:true,last:0,n:0,
  init(){
    if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return}

  },

    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

    if(back){this.tone(190,.09,'triangle',.11,0,.8);this.n=Math.max(0,this.n-1);return}

  },
  click(){this.tone(620,.05,'square',.05)},
  start(){this.n=0;this.tone(220,.28,'sine',.12,0,2.2);this.tone(330,.22,'sine',.08,.08,2)},
  hint(){this.tone(880,.1,'sine',.15);this.tone(1175,.16,'sine',.15,.09)},
  err(){this.tone(150,.16,'sawtooth',.09,0,.7);this.tone(120,.18,'sawtooth',.08,.1,.7)},
  fog(){this.tone(110,.5,'sine',.14,0,.6);this.tone(165,.5,'sine',.08,.05,.6)},
  win(){
    [0,4,7,12,16,19,24].forEach((s,i)=>this.tone(this.hz(s+12),.32,'triangle',.16,i*.09));

  }

  const sc=e.target;if(mapBusy||sc.scrollTop>500)return;
  mapBusy=true;const inner=$('#mapInner'),oh=inner.offsetHeight;
  mapN+=20;renderMap(true);sc.scrollTop+=inner.offsetHeight-oh;
  setTimeout(()=>{mapBusy=false},200);
},{passive:true});

/* ---------- wiring ---------- */
$('#playBtn').onclick=()=>startLevel(S.level);
$('#petsBtn').onclick=()=>show('pets');
$('#mapBtn').onclick=()=>show('map');
$('#mapBack').onclick=()=>show('home');
$('#mapPlay').onclick=()=>startLevel(S.level);
$('#homeLivesPill').onclick=tryRefillLife;$('#mapLivesPill').onclick=tryRefillLife;
$('#backBtn').onclick=()=>show('home');
$('#pauseBtn').onclick=pause;
$('#resumeBtn').onclick=resume;
$('#pRestartBtn').onclick=restartRun;
$('#pHomeBtn').onclick=()=>{hideOverlays();running=false;show('map')};
$('#hintBtn').onclick=useHint;
$('#restartBtn').onclick=restartRun;
$('#sndBtn').onclick=toggleSnd;$('#homeSnd').onclick=toggleSnd;
$('#nextBtn').onclick=()=>startLevel(Math.min(level+1,S.level));
$('#homeBtn').onclick=()=>{hideOverlays();show('map')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(screens.game.classList.contains('active')&&!won&&Math.abs(stage.clientWidth-W)+Math.abs(stage.clientHeight-H)>40)loadLevel();
},250)});
syncSnd();renderHome();show('map');
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
